    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vueuse-color-scheme')
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) {
            document.documentElement.classList.add('dark')
          }
          document.documentElement.style.backgroundColor = isDark ? '#151419' : '#f4f5f6'
        } catch (e) {
          document.documentElement.style.backgroundColor = '#f4f5f6'
        }
      })()
    </script>
